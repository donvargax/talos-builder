# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-1
    title: Adopt itos
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Add a controlled hosted ARM64 candidate workflow
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-1]
    kind: task
    refs: [docs/build-plan.md]
  - id: T-3
    title: Port vendor-kernel inputs and build a Talos 1.14.2 candidate
    phase: 1
    owner: null
    status: done
    depends_on: [T-2]
    kind: task
    refs: [docs/build-plan.md]
  - id: image-digests
    title: Record digests of tag-pulled images in candidate provenance
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The candidate pins every git source to a full commit, but the build still pulls
      ghcr.io/siderolabs tools, pkgs, bldr and the overlay toolchain images by tag. Recording the
      resolved digests (from BuildKit metadata or the local registry) in provenance.json would make
      a candidate auditable and reproducible without trusting mutable tags. Found during T-3.
    refs: [docs/build-evidence.md]
  - id: pi5-hardware-test
    title: Hardware test of the Talos 1.14.2 Pi 5 candidate
    phase: 1
    owner: null
    status: todo
    depends_on: [T-3]
    kind: idea
    why: >
      T-3 produced a compile-only candidate. Boot, cold restart, Ethernet/etcd traffic under load,
      USB XFS volume and SD boot medium preservation, and the U-Boot 2026.01 change are untested.
      Needs separate approval, recovery material and an etcd snapshot; no flashing of the live SD
      card. See docs/build-evidence.md.
    refs: [docs/build-evidence.md, docs/build-plan.md]
  - id: pi5-intermediate-minors
    title: Pi 5 vendor-kernel candidates for Talos 1.12 and 1.13
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Talos tests configuration migration between adjacent minors, so the live 1.11.1 node cannot
      jump straight to 1.14.2. Each intermediate stage may need its own Pi-compatible vendor-kernel
      candidate built and recorded the way T-3 did for 1.14.2.
    refs: [docs/build-plan.md]
  - id: actions-node24
    title: Move pinned workflow actions to Node 24 releases
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Candidate run 39125900949 warned that actions/checkout, actions/upload-artifact and
      docker/setup-buildx-action at the pinned commits target the deprecated Node.js 20 and are
      being forced onto Node 24. Pin newer commits of each, keeping the commit-pin contract tests.
    refs: [.github/workflows/build.yaml, .github/workflows/ci.yml]
  - id: itos-upgrade
    title: Upgrade itos from 6.5.1 to 8.5.0
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      User approved 2026-10-18. Run itos upgrade 8.5.0 between agents, apply its By hand steps,
      update the AGENTS.md 6.5.1 line, reinstall hooks, itos config check.
