{
  "name": "ARM64 candidate (manual only)",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "arm64-candidate", "cancel-in-progress": false},
  "jobs": {
    "candidate": {
      "if": "github.repository == 'donvargax/talos-builder' && github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 180,
      "env": {"ITOS_NO_UPDATE": "1", "ITOS_NO_UPDATE_NOTICE": "1"},
      "steps": [
        {
          "name": "Checkout exact dispatch commit",
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false, "fetch-depth": 0}
        },
        {"name": "Install verified itos 6.5.1", "run": "bash scripts/install-itos.sh"},
        {"name": "Offline preflight", "run": "make check"},
        {"name": "Initialize evidence and local registry", "run": "bash scripts/candidate.sh prepare"},
        {
          "name": "Native ARM64 BuildKit, host-network local registry",
          "uses": "docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435",
          "with": {
            "version": "v0.28.0",
            "driver": "docker-container",
            "driver-opts": "network=host\nimage=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e",
            "buildkitd-config-inline": "[registry.\"localhost:5000\"]\n  http = true\n",
            "buildkitd-flags": "--debug=false"
          }
        },
        {"name": "Build committed candidate inputs", "run": "bash scripts/candidate.sh build"},
        {
          "name": "Collect provenance, hashes and failure diagnostics",
          "if": "always()",
          "run": "python3 scripts/build_contract.py collect"
        },
        {
          "name": "Retain candidate evidence even on failure",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "pi5-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "_out/candidate/",
            "if-no-files-found": "error",
            "compression-level": 0,
            "retention-days": 14
          }
        }
      ]
    }
  }
}
